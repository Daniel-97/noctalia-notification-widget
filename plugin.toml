id = "daniel-97/lockscreen-notifications"
name = "Lockscreen Notification Widget"
version = "1.0.0"
plugin_api = 51
author = "daniel-97"
license = "MIT"
deprecated = false
icon = "bell"
description = "Lockscreen/desktop widget that lists unread notifications, with app icons and relative ages."
tags = [ "desktop", "system", "utility" ]
dependencies = [ "dbus-monitor", "pgrep" ]

# Settings are shown in declaration order. Noctalia has no section/group
# primitive, so the list is ordered by purpose (display, behaviour) and the
# less common options are hidden behind the "show advanced" toggle.

[[setting]]
key = "max_items"
type = "int"
label_key = "settings.max_items.label"
description_key = "settings.max_items.description"
default = 6

[[setting]]
key = "show_body"
type = "bool"
label_key = "settings.show_body.label"
description_key = "settings.show_body.description"
default = false

[[setting]]
key = "show_icons"
type = "bool"
label_key = "settings.show_icons.label"
description_key = "settings.show_icons.description"
default = true

[[setting]]
key = "show_age"
type = "bool"
label_key = "settings.show_age.label"
description_key = "settings.show_age.description"
default = true

[[setting]]
key = "age_format"
type = "select"
label_key = "settings.age_format.label"
description_key = "settings.age_format.description"
default = "relative"
options = [
  { value = "relative", label_key = "settings.age_format.relative" },
  { value = "absolute", label_key = "settings.age_format.absolute" },
  { value = "both", label_key = "settings.age_format.both" },
]
visible_when = { key = "show_age", values = [ "true" ] }
advanced = true

[[setting]]
key = "summary_length"
type = "select"
label_key = "settings.summary_length.label"
description_key = "settings.summary_length.description"
default = "normal"
options = [
  { value = "short", label_key = "settings.summary_length.short" },
  { value = "normal", label_key = "settings.summary_length.normal" },
  { value = "long", label_key = "settings.summary_length.long" },
]

[[setting]]
key = "card_background"
type = "select"
label_key = "settings.card_background.label"
description_key = "settings.card_background.description"
default = "subtle"
options = [
  { value = "subtle", label_key = "settings.card_background.subtle" },
  { value = "solid", label_key = "settings.card_background.solid" },
  { value = "glass", label_key = "settings.card_background.glass" },
  { value = "none", label_key = "settings.card_background.none" },
]

[[setting]]
key = "group_notifications"
type = "bool"
label_key = "settings.group_notifications.label"
description_key = "settings.group_notifications.description"
default = true

[[setting]]
key = "order"
type = "select"
label_key = "settings.order.label"
description_key = "settings.order.description"
default = "newest"
options = [
  { value = "newest", label_key = "settings.order.newest" },
  { value = "oldest", label_key = "settings.order.oldest" },
]

[[setting]]
key = "language"
type = "select"
label_key = "settings.language.label"
description_key = "settings.language.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.language.auto" },
  { value = "en", label_key = "settings.language.en" },
  { value = "it", label_key = "settings.language.it" },
]

[[setting]]
key = "preview_when_empty"
type = "bool"
label_key = "settings.preview_when_empty.label"
description_key = "settings.preview_when_empty.description"
default = false
advanced = true

[[service]]
id = "watcher"
entry = "service.luau"

[[desktop_widget]]
id = "widget"
entry = "widget.luau"
