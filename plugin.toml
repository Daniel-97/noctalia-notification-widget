id = "daniel-97/missed-notifications"
name = "Lockscreen Notification Widget"
version = "1.2.0"
plugin_api = 51
author = "daniel-97"
license = "MIT"
deprecated = false
icon = "bell"
description = "Lockscreen/desktop widget that lists unread notifications, with app icons and relative ages."
tags = [ "desktop", "system", "utility" ]
dependencies = [ "dbus-monitor", "pgrep" ]

[[setting]]
key = "max_items"
type = "int"
label_key = "settings.max_items.label"
description_key = "settings.max_items.description"
default = 6

[[setting]]
key = "text_scale"
type = "select"
label_key = "settings.text_scale.label"
description_key = "settings.text_scale.description"
default = "1.3"
options = [
  { value = "1.3", label_key = "settings.text_scale.medium" },
  { value = "1.0", label_key = "settings.text_scale.small" },
  { value = "1.6", label_key = "settings.text_scale.large" },
  { value = "2.0", label_key = "settings.text_scale.huge" },
]

[[setting]]
key = "show_body"
type = "bool"
label_key = "settings.show_body.label"
description_key = "settings.show_body.description"
default = false

[[setting]]
key = "list_mode"
type = "select"
label_key = "settings.list_mode.label"
description_key = "settings.list_mode.description"
default = "unread"
options = [
  { value = "unread", label_key = "settings.list_mode.unread" },
  { value = "all", label_key = "settings.list_mode.all" },
]

[[setting]]
key = "language"
type = "select"
label_key = "settings.language.label"
description_key = "settings.language.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.language.auto" },
  { value = "en", label_key = "settings.language.en" },
  { value = "it", label_key = "settings.language.it" },
]

[[setting]]
key = "order"
type = "select"
label_key = "settings.order.label"
description_key = "settings.order.description"
default = "newest"
options = [
  { value = "newest", label_key = "settings.order.newest" },
  { value = "oldest", label_key = "settings.order.oldest" },
]

[[service]]
id = "watcher"
entry = "service.luau"

[[desktop_widget]]
id = "widget"
entry = "widget.luau"
